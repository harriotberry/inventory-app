<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Inventory Search</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #007AFF;
    --blue-light: #E8F1FF;
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --label: #8E8E93;
    --separator: #E5E5EA;
    --text: #1C1C1E;
    --text2: #3C3C43;
    --dimmed: #C7C7CC;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }

  #app { max-width: 430px; margin: 0 auto; position: relative; }

  .screen { display: none; flex-direction: column; min-height: 100dvh; }
  .screen.active { display: flex; }

  /* ── Loading / Error ── */
  #loading-screen {
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--label);
    font-size: 15px;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--separator);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Search screen ── */
  #search-screen { padding-bottom: env(safe-area-inset-bottom, 16px); }

  .search-header {
    background: var(--card);
    padding: 16px 16px 0;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s;
  }
  .search-header.scrolled { border-color: var(--separator); }

  .header-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .header-top h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.3px; }
  .report-date { font-size: 12px; color: var(--label); }

  .search-bar-wrap { position: relative; margin-bottom: 12px; }
  .search-icon {
    position: absolute; left: 10px; top: 50%;
    transform: translateY(-50%);
    color: var(--label); pointer-events: none;
  }
  #search-input {
    width: 100%; height: 40px;
    background: var(--bg); border: none;
    border-radius: var(--radius-sm);
    padding: 0 36px 0 34px;
    font-size: 17px; color: var(--text);
    outline: none; -webkit-appearance: none;
  }
  #search-input::placeholder { color: var(--label); }
  .clear-btn {
    position: absolute; right: 8px; top: 50%;
    transform: translateY(-50%);
    background: var(--dimmed); border: none;
    width: 20px; height: 20px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
    cursor: pointer; color: white;
    font-size: 11px; font-weight: 600; padding: 0; line-height: 1;
  }
  .clear-btn.visible { display: flex; }

  .pills-scroll {
    display: flex; gap: 6px;
    overflow-x: auto; padding-bottom: 12px;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .pills-scroll::-webkit-scrollbar { display: none; }
  .pill {
    flex-shrink: 0; height: 30px; padding: 0 12px;
    border-radius: 15px; font-size: 13px; font-weight: 500;
    border: 1.5px solid var(--separator);
    background: #fff; color: var(--text2);
    cursor: pointer; white-space: nowrap;
    transition: all 0.15s; -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center;
  }
  .pill.active { background: var(--blue); border-color: var(--blue); color: white; }

  #results-container { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .result-count { font-size: 13px; color: var(--label); margin-bottom: 8px; }

  .result-card {
    background: var(--card); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 10px;
    cursor: pointer; transition: opacity 0.1s;
    -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; gap: 12px;
  }
  .result-card:active { opacity: 0.7; }
  .result-card-body { flex: 1; min-width: 0; }
  .result-brand {
    font-size: 12px; color: var(--label); font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 2px;
  }
  .result-name {
    font-size: 16px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;
  }
  .result-sku { font-size: 13px; color: var(--label); }
  .result-stock { text-align: right; flex-shrink: 0; }
  .stock-number { font-size: 26px; font-weight: 700; color: var(--blue); line-height: 1; }
  .stock-number.zero { color: var(--dimmed); }
  .stock-label { font-size: 11px; color: var(--label); font-weight: 500; text-transform: uppercase; letter-spacing: 0.2px; margin-top: 1px; }
  .chevron-right { color: var(--dimmed); flex-shrink: 0; font-size: 18px; }

  .empty-state { text-align: center; padding: 60px 32px; color: var(--label); }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state .title { font-size: 17px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
  .empty-state .subtitle { font-size: 15px; }

  /* ── Detail screen ── */
  #detail-screen { background: var(--bg); padding-bottom: env(safe-area-inset-bottom, 16px); }

  .detail-header {
    background: var(--card); padding: 16px;
    border-bottom: 1px solid var(--separator);
    position: sticky; top: 0; z-index: 10;
  }
  .back-btn {
    display: flex; align-items: center; gap: 4px;
    background: none; border: none; color: var(--blue);
    font-size: 17px; cursor: pointer; padding: 0;
    margin-bottom: 16px; -webkit-tap-highlight-color: transparent;
  }
  .back-btn:active { opacity: 0.6; }
  .detail-brand { font-size: 13px; color: var(--label); font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 4px; }
  .detail-name { font-size: 22px; font-weight: 700; color: var(--text); line-height: 1.2; margin-bottom: 6px; }
  .detail-meta { display: flex; align-items: center; gap: 10px; }
  .detail-sku {
    font-size: 13px; color: var(--label);
    background: var(--bg); padding: 3px 8px;
    border-radius: 6px; font-family: "SF Mono", "Menlo", monospace;
  }
  .detail-date { font-size: 13px; color: var(--label); }

  .detail-body { padding: 16px; overflow-y: auto; }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .stat-card { background: var(--card); border-radius: var(--radius); padding: 14px 16px; }
  .stat-card.hero { background: var(--blue); grid-column: 1 / -1; }
  .stat-label { font-size: 12px; font-weight: 500; color: var(--label); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 4px; }
  .stat-card.hero .stat-label { color: rgba(255,255,255,0.75); }
  .stat-value { font-size: 36px; font-weight: 700; color: var(--text); line-height: 1; }
  .stat-card.hero .stat-value { color: white; font-size: 48px; }
  .stat-subtext { font-size: 13px; color: var(--label); margin-top: 2px; }
  .stat-card.hero .stat-subtext { color: rgba(255,255,255,0.65); }

  .section-title { font-size: 13px; font-weight: 600; color: var(--label); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px; padding: 0 4px; }
  .location-list { background: var(--card); border-radius: var(--radius); overflow: hidden; }
  .location-row {
    display: flex; align-items: center;
    padding: 13px 16px; border-bottom: 1px solid var(--separator); gap: 12px;
  }
  .location-row:last-child { border-bottom: none; }
  .location-row.zero-stock { opacity: 0.35; }
  .location-name { flex: 1; font-size: 15px; font-weight: 500; color: var(--text); min-width: 0; }
  .location-avail { font-size: 17px; font-weight: 700; color: var(--blue); flex-shrink: 0; }
  .location-row.zero-stock .location-avail { color: var(--dimmed); }
  .location-allocated { font-size: 12px; color: var(--label); flex-shrink: 0; text-align: right; white-space: nowrap; }

  mark { background: #FFEB3B44; color: inherit; border-radius: 2px; padding: 0 1px; }
</style>
</head>
<body>
<div id="app">

  <!-- Loading -->
  <div id="loading-screen" class="screen active">
    <div class="spinner"></div>
    <span>Loading inventory…</span>
  </div>

  <!-- Search -->
  <div id="search-screen" class="screen">
    <div class="search-header" id="search-header">
      <div class="header-top">
        <h1>Principal Inventory</h1>
        <span class="report-date" id="report-date-label"></span>
      </div>
      <div class="search-bar-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" id="search-input" placeholder="Search product, brand or SKU…"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="clear-btn" id="clear-btn" aria-label="Clear">✕</button>
      </div>
      <div class="pills-scroll" id="pills-container"></div>
    </div>
    <div id="results-container">
      <div class="result-count" id="result-count"></div>
      <div id="results-list"></div>
    </div>
  </div>

  <!-- Detail -->
  <div id="detail-screen" class="screen">
    <div class="detail-header">
      <button class="back-btn" id="back-btn">
        <svg width="10" height="17" viewBox="0 0 10 17" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 1 1 8.5 9 16"/>
        </svg>
        &nbsp;Inventory
      </button>
      <div class="detail-brand" id="detail-brand"></div>
      <div class="detail-name"  id="detail-name"></div>
      <div class="detail-meta">
        <span class="detail-sku"  id="detail-sku"></span>
        <span class="detail-date" id="detail-date"></span>
      </div>
    </div>
    <div class="detail-body">
      <div class="stats-grid"    id="stats-grid"></div>
      <div class="section-title">By Location</div>
      <div class="location-list" id="location-list"></div>
    </div>
  </div>

</div>
<script>
// ── State ─────────────────────────────────────────────────────────────────────
let PRODUCTS   = [];
let REPORT_DATE = '';
let query          = '';
let activeLocation = 'ALL';

// ── Screens ───────────────────────────────────────────────────────────────────
const loadingScreen = document.getElementById('loading-screen');
const searchScreen  = document.getElementById('search-screen');
const detailScreen  = document.getElementById('detail-screen');

function showScreen(name) {
  [loadingScreen, searchScreen, detailScreen].forEach(s => s.classList.remove('active'));
  document.getElementById(name + '-screen').classList.add('active');
}

// ── Load data ─────────────────────────────────────────────────────────────────
async function loadInventory() {
  showScreen('loading');
  try {
    const res  = await fetch('/api/inventory');
    const data = await res.json();

    if (data.error) throw new Error(data.error);

    PRODUCTS    = data.products || [];
    REPORT_DATE = data.reportDate || '';

    document.getElementById('report-date-label').textContent =
      REPORT_DATE ? `Report: ${REPORT_DATE}` : '';

    renderPills();
    renderResults();
    showScreen('search');
    document.getElementById('search-input').focus();

  } catch (err) {
    loadingScreen.innerHTML = `
      <div style="text-align:center;padding:40px 32px">
        <div style="font-size:48px;margin-bottom:12px">⚠️</div>
        <div style="font-size:17px;font-weight:600;color:#1C1C1E;margin-bottom:6px">Couldn't load inventory</div>
        <div style="font-size:15px;color:#8E8E93;margin-bottom:24px">${err.message}</div>
        <button onclick="loadInventory()" style="background:#007AFF;color:white;border:none;border-radius:10px;padding:12px 24px;font-size:16px;cursor:pointer">Try again</button>
      </div>`;
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function highlight(text, q) {
  if (!q) return escHtml(text);
  let result = escHtml(text);
  q.trim().split(/\s+/).filter(Boolean).forEach(token => {
    const re = new RegExp(`(${token.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
    result = result.replace(re, '<mark>$1</mark>');
  });
  return result;
}
function totals(product) {
  return product.locations.reduce((acc, l) => ({
    onHand:    acc.onHand    + l.onHand,
    allocated: acc.allocated + l.allocated,
    onOrder:   acc.onOrder   + l.onOrder,
    available: acc.available + l.available,
    inTransit: acc.inTransit + l.inTransit,
  }), { onHand:0, allocated:0, onOrder:0, available:0, inTransit:0 });
}
function availableForProduct(p) {
  if (activeLocation === 'ALL') return totals(p).available;
  const loc = p.locations.find(l => l.loc === activeLocation);
  return loc ? loc.available : 0;
}

// ── Filter ────────────────────────────────────────────────────────────────────
function filterProducts() {
  const tokens = query.toLowerCase().trim().split(/\s+/).filter(Boolean);
  return PRODUCTS.filter(p => {
    const haystack = [p.product, p.brand, p.sku].filter(Boolean).join(' ').toLowerCase();
    const matchesQuery = tokens.length === 0 || tokens.every(t => haystack.includes(t));
    if (!matchesQuery) return false;
    if (activeLocation === 'ALL') return true;
    return p.locations.some(l => l.loc === activeLocation && (l.available > 0 || l.onHand > 0));
  });
}

// ── Render results ────────────────────────────────────────────────────────────
function renderResults() {
  const filtered = filterProducts();
  const total = PRODUCTS.length;

  document.getElementById('result-count').textContent =
    filtered.length === total ? `${total} products` : `${filtered.length} of ${total} products`;

  if (filtered.length === 0 && total === 0) {
    document.getElementById('results-list').innerHTML = `
      <div class="empty-state">
        <div class="icon">📦</div>
        <div class="title">No report loaded yet</div>
        <div class="subtitle">The first report will appear here once Cin7 sends it to your Mailgun address</div>
      </div>`;
    return;
  }

  if (filtered.length === 0) {
    document.getElementById('results-list').innerHTML = `
      <div class="empty-state">
        <div class="icon">🔍</div>
        <div class="title">No results</div>
        <div class="subtitle">Try a different search or clear the filter</div>
      </div>`;
    return;
  }

  const q = query.toLowerCase().trim();
  document.getElementById('results-list').innerHTML = filtered.map(p => {
    const avail = availableForProduct(p);
    return `<div class="result-card" data-sku="${escHtml(p.sku)}">
      <div class="result-card-body">
        <div class="result-brand">${highlight(p.brand, q)}</div>
        <div class="result-name">${highlight(p.product, q)}</div>
        <div class="result-sku">${highlight(p.sku, q)}</div>
      </div>
      <div class="result-stock">
        <div class="stock-number${avail === 0 ? ' zero' : ''}">${avail}</div>
        <div class="stock-label">Available</div>
      </div>
      <div class="chevron-right">›</div>
    </div>`;
  }).join('');

  document.getElementById('results-list').querySelectorAll('.result-card').forEach(card => {
    card.addEventListener('click', () => {
      const p = PRODUCTS.find(p => p.sku === card.dataset.sku);
      if (p) showDetail(p);
    });
  });
}

// ── Render pills ──────────────────────────────────────────────────────────────
function renderPills() {
  const pills = [
    { key: 'ALL',                                  label: 'All' },
    { key: '14 Degrees',                           label: '14 Degrees' },
    { key: 'NSW Liquor Logistics',                 label: 'NSW LL' },
    { key: 'Holding Warehouse/Export Stock',       label: 'Holding' },
    { key: 'ELWOOD BATHERS - CONSIGNMENT STOCK',   label: 'Elwood' },
    { key: 'DOUG LOCKWOOD WAREHOUSE DROUIN',       label: 'Drouin' },
    { key: 'SANECTOR Mildura/Melbourne',           label: 'Sanector' },
  ];
  document.getElementById('pills-container').innerHTML = pills.map(p =>
    `<button class="pill${activeLocation === p.key ? ' active' : ''}" data-location="${p.key}">${p.label}</button>`
  ).join('');
  document.getElementById('pills-container').querySelectorAll('.pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeLocation = btn.dataset.location;
      renderPills();
      renderResults();
    });
  });
}

// ── Detail view ───────────────────────────────────────────────────────────────
function showDetail(product) {
  const t = totals(product);

  document.getElementById('detail-brand').textContent = product.brand || '';
  document.getElementById('detail-name').textContent  = product.product || '';
  document.getElementById('detail-sku').textContent   = product.sku;
  document.getElementById('detail-date').textContent  = REPORT_DATE ? `Report: ${REPORT_DATE}` : '';

  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card hero">
      <div class="stat-label">Available</div>
      <div class="stat-value">${t.available}</div>
      <div class="stat-subtext">ready to sell</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">On Hand</div>
      <div class="stat-value">${t.onHand}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Allocated</div>
      <div class="stat-value">${t.allocated}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">On Order</div>
      <div class="stat-value">${t.onOrder}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">In Transit</div>
      <div class="stat-value">${t.inTransit}</div>
    </div>`;

  const withStock = product.locations
    .filter(l => l.onHand > 0 || l.available > 0 || l.allocated > 0 || l.onOrder > 0)
    .sort((a, b) => b.available - a.available);
  const zeroStock = product.locations
    .filter(l => l.onHand === 0 && l.available === 0 && l.allocated === 0 && l.onOrder === 0);

  document.getElementById('location-list').innerHTML = [...withStock, ...zeroStock].map(l => {
    const isZero = l.available === 0 && l.onHand === 0;
    return `<div class="location-row${isZero ? ' zero-stock' : ''}">
      <div class="location-name">${escHtml(l.loc)}</div>
      <div class="location-avail">${l.available}</div>
      <div class="location-allocated">${l.allocated > 0 ? `${l.allocated} alloc` : ''}</div>
    </div>`;
  }).join('');

  showScreen('detail');
  window.scrollTo(0, 0);
  document.querySelector('.detail-body').scrollTop = 0;
}

// ── Events ────────────────────────────────────────────────────────────────────
document.getElementById('back-btn').addEventListener('click', () => showScreen('search'));

document.getElementById('search-input').addEventListener('input', e => {
  query = e.target.value;
  document.getElementById('clear-btn').classList.toggle('visible', query.length > 0);
  renderResults();
});

document.getElementById('clear-btn').addEventListener('click', () => {
  document.getElementById('search-input').value = '';
  query = '';
  document.getElementById('clear-btn').classList.remove('visible');
  document.getElementById('search-input').focus();
  renderResults();
});

document.getElementById('results-container').addEventListener('scroll', e => {
  document.getElementById('search-header').classList.toggle('scrolled', e.target.scrollTop > 0);
});

// ── Boot ──────────────────────────────────────────────────────────────────────
loadInventory();
</script>
</body>
</html>
